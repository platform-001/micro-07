
name: CI/CD Deploy (ECR + App Runner + Port)

on:
  workflow_dispatch:
    inputs:
      app_runner_service_arn:
        description: "App Runner Service ARN"
        required: true
        type: string
      ecr_repository_uri:
        description: "ECR repository URI (sin tag). Ej: 123.dkr.ecr.us-west-1.amazonaws.com/mic-003"
        required: false
        type: string
      branch_identifier:
        description: "Branch identifier. Ej: mic-003:main"
        required: true
        type: string
      aws_region:
        description: "AWS region override (optional)"
        required: false
        type: string

jobs:
  build_test_scan:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.coverage }}
      secrets_found: ${{ steps.secrets.outputs.count }}
      high_vulns: ${{ steps.vulns.outputs.high }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test
        run: mvn -B clean verify

      # Cobertura (JaCoCo)
      - name: Compute coverage
        id: cov
        run: |
          CSV=$(find . -path "*target/site/jacoco/jacoco.csv" | head -n 1 || true)
          if [ -z "$CSV" ]; then echo "coverage=0" >> $GITHUB_OUTPUT; exit 0; fi
          awk -F',' 'NR>1 { missed+=$4; covered+=$5 }
            END { total=missed+covered; if (total==0) print "coverage=0";
                  else printf("coverage=%d\n",(covered*100)/total) }' "$CSV" >> $GITHUB_OUTPUT
      # Secret scanning (Gitleaks)
      - name: Gitleaks scan
        id: gitleaks
        continue-on-error: true
        run: |
          # Usamos la versión 8.18.4 explícitamente para evitar sorpresas con 'latest'
          VERSION="8.18.4"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          
          curl -sSL "$URL" -o gitleaks.tar.gz
          
          # Verificamos si es realmente un gzip antes de intentar descomprimir
          if file gitleaks.tar.gz | grep -q "gzip compressed data"; then
            tar -xzf gitleaks.tar.gz gitleaks
            chmod +x gitleaks
            ./gitleaks detect --no-git --source . --report-format json --report-path gitleaks-report.json
          else
            echo "Error: El archivo descargado no es un GZIP válido. Probablemente la URL es incorrecta."
            cat gitleaks.tar.gz # Esto te mostrará el error HTML si es que hubo uno
            exit 1
          fi
      

      - name: Count secrets
        id: secrets
        run: |
          cat << 'PY' > count_secrets.py
          import json, os
          try:
              if os.path.exists("gitleaks-report.json"):
                  with open("gitleaks-report.json") as f:
                      d = json.load(f)
                      print(len(d) if isinstance(d, list) else 0)
              else:
                  print(0)
          except Exception:
              print(0)
          PY
          COUNT=$(python count_secrets.py)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      # SCA (OWASP Dependency-Check)
      - name: Cache Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: odc-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            odc-${{ runner.os }}-

      - name: Dependency-Check
        id: depcheck
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # El flag -DdataDirectory ayuda a evitar problemas de permisos/rutas temporales
          mvn -B org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -DoutputDirectory=target/dependency-check \
            -DdataDirectory=${{ github.workspace }}/dependency-check-data \
            -DnvdApiKey=$NVD_API_KEY
            
      - name: Count HIGH vulns
        id: vulns
        run: |
          cat << 'PY' > count_high_vulns.py
          import json, os
          report = "target/dependency-check/dependency-check-report.json"
          try:
              if os.path.exists(report):
                  with open(report) as f:
                      r = json.load(f)
                      high = 0
                      for d in r.get("dependencies", []):
                          for v in (d.get("vulnerabilities") or []):
                              if (v.get("severity") or "").upper() == "HIGH":
                                  high += 1
                      print(high)
              else:
                  print(0)
          except Exception:
              print(0)
          PY
          HIGH=$(python count_high_vulns.py)
          echo "high=$HIGH" >> $GITHUB_OUTPUT
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco/**
            target/dependency-check/**
            gitleaks-report.json
          if-no-files-found: warn

  deploy:
    if: github.event_name != 'pull_request'
    needs: build_test_scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      runtime_url: ${{ steps.runtime.outputs.runtime_url }}
      deploy_ok: ${{ steps.runtime.outputs.deploy_ok }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
      service_arn_used: ${{ steps.pick.outputs.service_arn }}
      repo_uri_used: ${{ steps.pick.outputs.repo_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          aws-region: ${{ inputs.aws_region || vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Decide de dónde vienen los datos (inputs desde Port o fallback secrets/convention)
      - name: Pick Service ARN and ECR URI
        id: pick
        env:
          INPUT_SERVICE_ARN: ${{ inputs.app_runner_service_arn }}
          INPUT_ECR_URI: ${{ inputs.ecr_repository_uri }}
          FALLBACK_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Service ARN: input > secret fallback
          if [ -n "$INPUT_SERVICE_ARN" ]; then
            SERVICE_ARN="$INPUT_SERVICE_ARN"
          else
            SERVICE_ARN="$FALLBACK_SERVICE_ARN"
          fi

          if [ -z "$SERVICE_ARN" ]; then
            echo "ERROR: Missing App Runner service ARN. Provide inputs.app_runner_service_arn or secrets.APP_RUNNER_SERVICE_ARN"
            exit 1
          fi

          # Repo URI: input > derived from registry + repo name
          if [ -n "$INPUT_ECR_URI" ]; then
            REPO_URI="$INPUT_ECR_URI"
          else
            REPO_URI="$ECR_REGISTRY/$REPO_NAME"
          fi

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "repo_uri=$REPO_URI" >> $GITHUB_OUTPUT

      - name: Build & Push image to ECR (Jib)
        id: meta
        env:
          IMAGE_URI: ${{ steps.pick.outputs.repo_uri }}:${{ github.sha }}
        run: |
          echo "Pushing image: ${IMAGE_URI}"
          test -n "${IMAGE_URI}" || (echo "IMAGE_URI is empty" && exit 1)
          mvn -B -DskipTests package com.google.cloud.tools:jib-maven-plugin:3.4.0:build -Dimage="${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Update App Runner service
        env:
          AWS_REGION:  ${{ inputs.aws_region || vars.AWS_REGION }}
          SERVICE_ARN: ${{ steps.pick.outputs.service_arn }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --region "$AWS_REGION" \
            --source-configuration "ImageRepository={ImageIdentifier=$IMAGE_URI,ImageRepositoryType=ECR,ImageConfiguration={Port=8080}}"

      - name: Get runtime URL
        id: runtime
        env:
          AWS_REGION:  ${{ inputs.aws_region || vars.AWS_REGION }}
          SERVICE_ARN: ${{ steps.pick.outputs.service_arn }}
        run: |
          URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --region "$AWS_REGION" --query "Service.ServiceUrl" --output text)
          if [[ "$URL" == http* ]]; then R="$URL"; else R="https://$URL"; fi
          echo "runtime_url=$R" >> $GITHUB_OUTPUT
          echo "deploy_ok=true" >> $GITHUB_OUTPUT

  update_port:
    if: always() && github.event_name != 'pull_request'
    needs: [build_test_scan, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Port (microservicio + branch + ecr_repository + openapi)
        env:
          PORT_WEBHOOK_URL_INFRA: ${{ secrets.PORT_WEBHOOK_URL_INFRA }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNTIME_URL: ${{ needs.deploy.outputs.runtime_url }}
          DEPLOY_OK: ${{ needs.deploy.outputs.deploy_ok }}
          IMAGE_URI: ${{ needs.deploy.outputs.image_uri }}
          AWS_REGION:  ${{ inputs.aws_region || vars.AWS_REGION }}
          COVERAGE: ${{ needs.build_test_scan.outputs.coverage }}
          SECRETS_FOUND: ${{ needs.build_test_scan.outputs.secrets_found }}
          HIGH_VULNS: ${{ needs.build_test_scan.outputs.high_vulns }}
          GATES_OK: ${{ needs.build_test_scan.outputs.gates_ok }}
          SERVICE_ARN_USED: ${{ needs.deploy.outputs.service_arn_used }}
          REPO_URI_USED: ${{ needs.deploy.outputs.repo_uri_used }}
          INPUT_BRANCH_IDENTIFIER: ${{ inputs.branch_identifier }}
        run: |
          if [ -z "$PORT_WEBHOOK_URL_INFRA" ]; then
            echo "ERROR: Missing secrets.PORT_WEBHOOK_URL_INFRA"
            exit 1
          fi

          python - << 'PY'
            import json, os, pathlib
            from datetime import datetime, timezone

            repo=os.environ["REPO"]
            branch=os.environ["BRANCH"]
            run_url=os.environ["RUN_URL"]

            deploy_ok=os.environ.get("DEPLOY_OK","") == "true"
            gates_ok=os.environ.get("GATES_OK","") == "true"

            coverage=float(os.environ.get("COVERAGE") or 0)
            secrets_found=float(os.environ.get("SECRETS_FOUND") or 0)
            high_vulns=float(os.environ.get("HIGH_VULNS") or 0)

            image_uri=os.environ.get("IMAGE_URI","")
            aws_region=os.environ.get("AWS_REGION","")
            service_arn=os.environ.get("SERVICE_ARN_USED","")
            repo_uri=os.environ.get("REPO_URI_USED","")

            # branch_identifier: input (si vino desde Port) o default repo:branch
            input_branch_id=os.environ.get("INPUT_BRANCH_IDENTIFIER","") or ""
            branch_identifier = input_branch_id if input_branch_id else f"{repo}:{branch}"

            # Estado final
            status = "Desplegado" if (deploy_ok and gates_ok) else "Con errores"

            # OpenAPI YAML
            openapi_path = pathlib.Path("api/openapi.yaml")
            open_api = openapi_path.read_text(encoding="utf-8") if openapi_path.exists() else ""

            tag=image_uri.split(":")[-1] if ":" in image_uri else ""

            payload = {
              "microservicio": {
                "cod_servicio": repo,
                "nombre_servicio": repo,
                "open_api": open_api,
                "tecnologia": "Java",
                "estado_de_aprovisionamiento": "Generado"
              },
              "branch": {
                "codigo_branch": branch_identifier,
                "build_status": status,
                "cobertura": coverage,
                "vulnerabilidades_altas": high_vulns,
                "secretos_encontrados": secrets_found,
                "url_pipeline": run_url
              },
              "ecr_repository": {
                "identifier": f"ecr:{repo}:{branch}",
                "repo_name": repo,
                "aws_region": aws_region,
                "aws_account_id": "",
                "repository_uri": repo_uri,
                "image_tag": tag,
                "image_uri": image_uri,
                "pushed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),
                "branch_identifier": branch_identifier,
                "app_runner_service_arn": service_arn,
                "service_url": os.environ.get("RUNTIME_URL","")
              }
            }

            print(json.dumps(payload))
            PY > payload.json

          curl -sS -X POST -H "Content-Type: application/json" -d @payload.json "$PORT_WEBHOOK_URL_INFRA"
  
